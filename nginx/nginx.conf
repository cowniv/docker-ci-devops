# Reverse proxy in front of the Node API. Only nginx is published to the host.
upstream notes_api {
    server api:4000;
    keepalive 16;
}

# basic rate limit: 10 req/s per client IP, small burst allowed
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
